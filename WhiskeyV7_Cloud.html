<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiskey Tasting Journal - Cloud Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e', 900: '#78350f', 950: '#451a03' },
                    },
                    fontFamily: { cinzel: ['Cinzel', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
        .gold-glow { box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.3); }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #f59e0b; cursor: pointer; box-shadow: 0 0 10px rgba(245, 158, 11, 0.8); border: 2px solid #fff;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-amber-950/20 to-slate-950 text-slate-200 antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- HEADER / NAVBAR -->
    <header class="border-b border-amber-900/30 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-700 via-amber-500 to-amber-300 p-0.5 shadow-lg shadow-amber-950/50">
                    <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center">
                        <i class="fa-solid font-bold fa-glass-whiskey text-amber-400 text-lg"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-cinzel text-xl sm:text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600">
                        AMBER & OAK
                    </h1>
                    <p class="text-[10px] sm:text-xs text-amber-500/70 tracking-widest uppercase font-medium">Cloud Edition</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-4">
                <button onclick="manualRefresh()" class="p-2.5 sm:px-4 sm:py-2 rounded-xl border border-amber-900/40 bg-slate-900/80 hover:bg-amber-950/40 hover:border-amber-600/50 text-amber-300 text-xs sm:text-sm font-medium transition duration-200 flex items-center gap-2" title="Daten neu laden">
                    <i class="fa-solid fa-rotate text-amber-400" id="syncIcon"></i>
                    <span class="hidden sm:inline">Sync</span>
                </button>
                <button onclick="openFormModal()" class="px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-gradient-to-r from-amber-600 via-amber-500 to-amber-600 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-semibold text-xs sm:text-sm shadow-md shadow-amber-950/60 hover:shadow-amber-500/20 transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-plus text-slate-950 font-black"></i>
                    <span>Neuer Whiskey</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <!-- FILTER & CONTROL BAR -->
        <section class="bg-slate-900/60 border border-amber-900/20 rounded-2xl p-4 sm:p-5 backdrop-blur-sm flex flex-col md:flex-row gap-4 items-center justify-between shadow-xl">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderApp()" placeholder="Whiskey suchen..." class="w-full bg-slate-950/80 border border-slate-800 focus:border-amber-500/60 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-amber-500/50 transition">
            </div>
            <div class="flex flex-wrap sm:flex-nowrap items-center justify-between md:justify-end w-full md:w-auto gap-4">
                <div class="text-xs text-slate-400 font-medium px-3 py-1.5 rounded-lg bg-slate-950/60 border border-slate-800">
                    Einträge: <span id="countBadge" class="text-amber-400 font-bold">0</span>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="sortBy" class="text-xs font-medium text-slate-400 whitespace-nowrap"><i class="fa-solid fa-sort mr-1 text-amber-500"></i> Sortieren:</label>
                    <select id="sortBy" onchange="renderApp()" class="w-full sm:w-auto bg-slate-950/80 border border-slate-800 focus:border-amber-500/60 rounded-xl px-3 py-2 text-xs text-amber-200 focus:outline-none focus:ring-1 focus:ring-amber-500/50 cursor-pointer">
                        <option value="score-desc">Bewertung (Höchste zuerst)</option>
                        <option value="score-asc">Bewertung (Niedrigste zuerst)</option>
                        <option value="date-desc">Neueste zuerst</option>
                        <option value="date-asc">Älteste zuerst</option>
                        <option value="name-asc">Name (A-Z)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- GRID -->
        <section>
            <div id="whiskeyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center bg-slate-900/30 rounded-3xl border border-dashed border-amber-900/30 my-8">
                <div class="w-16 h-16 rounded-full bg-amber-950/40 border border-amber-800/40 flex items-center justify-center mb-4 text-amber-500/60 text-2xl" id="emptyIcon">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                </div>
                <h3 class="font-cinzel text-lg font-bold text-slate-300 mb-1" id="emptyTitle">Lade Daten aus der Cloud...</h3>
                <p class="text-xs text-slate-500 max-w-sm mb-6" id="emptyDesc">Bitte warten, Verbindung zu Google Sheets wird hergestellt.</p>
                <button id="emptyBtn" onclick="openFormModal()" class="hidden px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 rounded-xl text-xs font-semibold transition">Jetzt ersten Whiskey bewerten</button>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-600">
        <p>© <span id="year"></span> Amber & Oak — Cloud Edition. <span class="text-amber-600/50">Powered by Google Sheets API.</span></p>
    </footer>

    <!-- ADD / EDIT MODAL -->
    <div id="formModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="relative bg-slate-900 border border-amber-900/40 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden gold-glow my-8">
            <div class="bg-slate-950 px-6 py-4 border-b border-amber-900/30 flex items-center justify-between">
                <h3 id="modalTitle" class="font-cinzel text-lg font-bold text-amber-300 flex items-center gap-2"><i class="fa-solid fa-plus-circle text-amber-500"></i> Whiskey Hinzufügen</h3>
                <button onclick="closeFormModal()" class="text-slate-400 hover:text-slate-100 transition p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="whiskeyForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-5">
                <input type="hidden" id="whiskeyId">
                <div>
                    <label class="block text-xs font-semibold text-amber-200/80 uppercase tracking-wider mb-2">Whiskey Name *</label>
                    <input type="text" id="whiskeyName" required placeholder="z. B. Lagavulin 16 Jahre" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-200/80 uppercase tracking-wider mb-2">Flaschen- / Glasfoto</label>
                    <div class="flex items-center gap-4">
                        <div id="imagePreviewContainer" class="relative w-20 h-20 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden flex-shrink-0">
                            <i id="placeholderIcon" class="fa-solid fa-image text-slate-700 text-2xl"></i>
                            <img id="imagePreview" class="hidden w-full h-full object-contain p-1" alt="Vorschau">
                        </div>
                        <div class="flex-grow">
                            <input type="file" id="whiskeyImage" accept="image/*" onchange="previewImage(event)" class="hidden">
                            <label for="whiskeyImage" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium cursor-pointer transition border border-slate-700">
                                <i class="fa-solid fa-camera text-amber-400"></i> Bild auswählen
                            </label>
                            <p class="text-[11px] text-slate-500 mt-1.5">Bildgröße wird fürs Google Sheet optimiert.</p>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-amber-200/80 uppercase tracking-wider">Bewertung (0.0 - 10.0) *</label>
                        <div class="flex items-center gap-1.5 bg-amber-950/60 border border-amber-700/50 px-3 py-1 rounded-lg">
                            <i class="fa-solid fa-star text-amber-400 text-xs"></i>
                            <input type="number" id="ratingInput" min="0" max="10" step="0.1" value="7.5" oninput="syncRatingFromInput()" class="w-14 bg-transparent text-right font-bold text-amber-300 text-base focus:outline-none">
                            <span class="text-xs text-amber-500/70">/ 10</span>
                        </div>
                    </div>
                    <input type="range" id="ratingSlider" min="0" max="10" step="0.1" value="7.5" oninput="syncRatingFromSlider()" class="w-full h-2 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-amber-500">
                    <div class="flex justify-between text-[10px] text-slate-500 mt-1"><span>0.0</span><span>5.0</span><span>10.0</span></div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-200/80 uppercase tracking-wider mb-2">Tasting Notes & Beschreibung</label>
                    <textarea id="whiskeyNotes" rows="3" placeholder="Geschmack, Aromen..." class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500 resize-none"></textarea>
                </div>
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeFormModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">Abbrechen</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition shadow-lg shadow-amber-950/80">
                        Speichern <i class="fa-solid fa-cloud-arrow-up ml-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DETAIL VIEW MODAL -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
        <div class="relative bg-slate-900 border border-amber-900/40 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden gold-glow my-8">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 z-10 w-8 h-8 rounded-full bg-slate-950/70 border border-slate-700 text-slate-300 hover:text-white flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div id="lightboxModal" class="fixed inset-0 z-[60] hidden bg-black/95 backdrop-blur-sm flex items-center justify-center p-4 cursor-zoom-out transition-opacity duration-300" onclick="closeLightbox()">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 md:top-6 md:right-6 z-[70] w-10 h-10 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 flex items-center justify-center transition shadow-lg">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <img id="lightboxImage" src="" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl cursor-default" onclick="event.stopPropagation();">
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 border border-amber-500/50 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i id="toastIcon" class="fa-solid fa-info-circle text-amber-400 text-lg"></i>
        <span id="toastMessage" class="text-xs font-medium">Lade...</span>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // =========================================================
        // TRAGE HIER DEINE GOOGLE APPS SCRIPT WEB-APP URL EIN
        // =========================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbyKsLNkMfxVrTuQ-u3e1m64L6JqoN5Kkd2RFQfuKc6-nyN5qvCUPboRgIeNVrwFkeUX/exec';
        
        let whiskeys = [];
        let currentCompressedImageBase64 = '';

        window.onload = async function() {
            document.getElementById('year').textContent = new Date().getFullYear();
            
            if (API_URL === 'HIER_DEINE_URL_EINTRAGEN') {
                showEmptyStateError('API-URL fehlt!', 'Bitte trage im HTML-Code deine Google Apps Script URL ein (Zeile 193).');
                return;
            }
            
            await fetchCloudData();
        };

        async function fetchCloudData() {
            showEmptyStateLoading();
            const icon = document.getElementById('syncIcon');
            icon.classList.add('fa-spin');
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                whiskeys = data;
                renderApp();
                showToast("Daten aus der Cloud synchronisiert!");
            } catch (error) {
                console.error("Fetch Error:", error);
                showToast("Fehler beim Laden der Cloud-Daten.", true);
                if (whiskeys.length === 0) showEmptyStateError('Verbindungsfehler', 'Konnte nicht mit Google Sheets verbinden.');
            }
            icon.classList.remove('fa-spin');
        }

        async function manualRefresh() {
            await fetchCloudData();
        }

        async function syncItemToCloud(action, item) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: action, data: item })
                });
            } catch (e) {
                console.error("Sync Error:", e);
                showToast("Fehler bei der Cloud-Synchronisation.", true);
            }
        }

        function renderApp() {
            const grid = document.getElementById('whiskeyGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortBy = document.getElementById('sortBy').value;

            let filtered = whiskeys.filter(w => w.name.toLowerCase().includes(searchVal) || (w.notes && w.notes.toLowerCase().includes(searchVal)));

            filtered.sort((a, b) => {
                if (sortBy === 'score-desc') return b.score - a.score;
                if (sortBy === 'score-asc') return a.score - b.score;
                if (sortBy === 'date-desc') return new Date(b.date) - new Date(a.date);
                if (sortBy === 'date-asc') return new Date(a.date) - new Date(b.date);
                if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
                return 0;
            });

            const sortedByScoreAll = [...whiskeys].sort((a, b) => b.score - a.score);
            const rankMap = new Map();
            sortedByScoreAll.forEach((item, index) => { rankMap.set(item.id, index + 1); });

            document.getElementById('countBadge').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                showEmptyStateNormal();
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            grid.innerHTML = filtered.map(w => {
                const globalRank = rankMap.get(w.id);
                let rankBadgeHTML = '';
                if (globalRank === 1) rankBadgeHTML = `<div class="absolute top-3 left-3 bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 text-slate-950 font-black text-xs px-3 py-1 rounded-full shadow-lg flex items-center gap-1 z-10 border border-yellow-200"><i class="fa-solid fa-crown text-xs"></i> #1 RANK</div>`;
                else if (globalRank === 2) rankBadgeHTML = `<div class="absolute top-3 left-3 bg-slate-300 text-slate-950 font-black text-xs px-2.5 py-1 rounded-full shadow-md flex items-center gap-1 z-10"><i class="fa-solid fa-medal"></i> #2</div>`;
                else if (globalRank === 3) rankBadgeHTML = `<div class="absolute top-3 left-3 bg-amber-700 text-amber-100 font-black text-xs px-2.5 py-1 rounded-full shadow-md flex items-center gap-1 z-10"><i class="fa-solid fa-award"></i> #3</div>`;
                else rankBadgeHTML = `<div class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md text-slate-400 font-bold text-xs px-2.5 py-1 rounded-full border border-slate-800 z-10">#${globalRank}</div>`;

                const fallbackImg = 'https://images.unsplash.com/photo-1527281400683-1aae777175f8?auto=format&fit=crop&w=600&q=80';
                const formattedDate = new Date(w.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

                return `
                <div class="group bg-slate-900/80 border border-amber-900/20 hover:border-amber-500/50 rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl transition duration-300 flex flex-col justify-between relative">
                    ${rankBadgeHTML}
                    <div class="relative h-52 w-full overflow-hidden bg-slate-950 cursor-pointer p-2" onclick="openDetailModal('${w.id}')">
                        <img src="${w.image || fallbackImg}" onerror="this.src='${fallbackImg}'" alt="${escapeHtml(w.name)}" class="w-full h-full object-contain group-hover:scale-105 transition duration-500 ease-out opacity-90 group-hover:opacity-100">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent pointer-events-none"></div>
                        <div class="absolute bottom-3 right-3 bg-slate-950/90 border border-amber-500/40 backdrop-blur-md px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-lg">
                            <i class="fa-solid fa-star text-amber-400 text-sm"></i><span class="font-bold text-amber-300 text-lg">${Number(w.score).toFixed(1)}</span>
                        </div>
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between space-y-3">
                        <div>
                            <div class="text-[11px] text-slate-500 mb-1 font-medium"><i class="fa-regular fa-calendar-alt mr-1"></i>${formattedDate}</div>
                            <h3 class="font-cinzel text-lg font-bold text-slate-100 group-hover:text-amber-300 transition line-clamp-1 cursor-pointer" onclick="openDetailModal('${w.id}')">${escapeHtml(w.name)}</h3>
                            <p class="text-xs text-slate-400 mt-2 line-clamp-2 leading-relaxed italic">${w.notes ? `"${escapeHtml(w.notes)}"` : '<span class="text-slate-600 font-normal">Keine Tasting Notes hinterlegt.</span>'}</p>
                        </div>
                        <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
                            <button onclick="openDetailModal('${w.id}')" class="text-amber-400/90 hover:text-amber-300 font-semibold flex items-center gap-1">Details <i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                            <div class="flex items-center space-x-2">
                                <button onclick="editWhiskey('${w.id}')" class="p-2 text-slate-400 hover:text-amber-300 hover:bg-slate-800 rounded-lg transition" title="Bearbeiten"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteWhiskey('${w.id}')" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition" title="Löschen"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // UI HELPERS für Lade-Status
        function showEmptyStateLoading() {
            const el = document.getElementById('emptyState');
            el.classList.remove('hidden'); el.classList.add('flex');
            document.getElementById('emptyIcon').innerHTML = '<i class="fa-solid fa-spinner fa-spin text-amber-500"></i>';
            document.getElementById('emptyTitle').textContent = 'Lade Daten aus der Cloud...';
            document.getElementById('emptyDesc').textContent = 'Bitte warten, Verbindung zu Google Sheets wird hergestellt.';
            document.getElementById('emptyBtn').classList.add('hidden');
        }
        function showEmptyStateError(title, desc) {
            const el = document.getElementById('emptyState');
            el.classList.remove('hidden'); el.classList.add('flex');
            document.getElementById('emptyIcon').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-500"></i>';
            document.getElementById('emptyTitle').textContent = title;
            document.getElementById('emptyDesc').textContent = desc;
            document.getElementById('emptyBtn').classList.add('hidden');
        }
        function showEmptyStateNormal() {
            const el = document.getElementById('emptyState');
            el.classList.remove('hidden'); el.classList.add('flex');
            document.getElementById('emptyIcon').innerHTML = '<i class="fa-solid fa-whiskey-glass text-amber-500/60"></i>';
            document.getElementById('emptyTitle').textContent = 'Keine Whiskeys gefunden';
            document.getElementById('emptyDesc').textContent = 'Füge deinen ersten Whiskey hinzu.';
            document.getElementById('emptyBtn').classList.remove('hidden');
        }

        function syncRatingFromSlider() { document.getElementById('ratingInput').value = parseFloat(document.getElementById('ratingSlider').value).toFixed(1); }
        function syncRatingFromInput() { 
            let val = parseFloat(document.getElementById('ratingInput').value);
            if (isNaN(val)) val = 0; if (val > 10) val = 10; if (val < 0) val = 0;
            document.getElementById('ratingSlider').value = val;
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height; const maxDim = 600;
                    if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } } 
                    else { if (height > maxDim) { width *= maxDim / height; height = maxDim; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentCompressedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    document.getElementById('imagePreview').src = currentCompressedImageBase64;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('placeholderIcon').classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function editWhiskey(id) {
            openFormModal(id);
        }

        function openFormModal(editId = null) {
            const modal = document.getElementById('formModal');
            document.getElementById('whiskeyForm').reset();
            currentCompressedImageBase64 = '';
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('placeholderIcon');

            if (editId) {
                const w = whiskeys.find(item => String(item.id) === String(editId));
                if (w) {
                    document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-500"></i> Bearbeiten`;
                    document.getElementById('whiskeyId').value = w.id;
                    document.getElementById('whiskeyName').value = w.name;
                    document.getElementById('ratingSlider').value = w.score;
                    document.getElementById('ratingInput').value = Number(w.score).toFixed(1);
                    document.getElementById('whiskeyNotes').value = w.notes || '';
                    if (w.image) {
                        currentCompressedImageBase64 = w.image;
                        preview.src = w.image; preview.classList.remove('hidden'); placeholder.classList.add('hidden');
                    } else {
                        preview.classList.add('hidden'); placeholder.classList.remove('hidden');
                    }
                }
            } else {
                document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-plus-circle text-amber-500"></i> Hinzufügen`;
                document.getElementById('whiskeyId').value = '';
                document.getElementById('ratingSlider').value = 7.5;
                document.getElementById('ratingInput').value = '7.5';
                preview.classList.add('hidden'); placeholder.classList.remove('hidden');
            }
            modal.classList.remove('hidden');
        }

        function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const idInput = document.getElementById('whiskeyId').value;
            const existing = idInput ? whiskeys.find(w => String(w.id) === String(idInput)) : null;

            const item = {
                id: idInput || 'w-' + Date.now(),
                name: document.getElementById('whiskeyName').value.trim(),
                score: parseFloat(document.getElementById('ratingInput').value),
                notes: document.getElementById('whiskeyNotes').value.trim(),
                image: currentCompressedImageBase64 || (existing ? existing.image : ''),
                date: existing ? existing.date : new Date().toISOString()
            };

            if (idInput && existing) {
                const index = whiskeys.findIndex(w => String(w.id) === String(idInput));
                if (index !== -1) whiskeys[index] = item;
                showToast("Aktualisiere in Google Sheets...", false, true);
            } else {
                whiskeys.unshift(item);
                showToast("Speichere in Google Sheets...", false, true);
            }

            renderApp();
            closeFormModal();
            
            // Background Sync
            await syncItemToCloud('save', item);
            showToast("Erfolgreich in der Cloud gesichert!");
        }

        async function deleteWhiskey(id) {
            const w = whiskeys.find(item => String(item.id) === String(id));
            if (!w) return;
            if (confirm(`Möchtest du "${w.name}" wirklich überall löschen?`)) {
                whiskeys = whiskeys.filter(item => String(item.id) !== String(id));
                renderApp();
                showToast("Lösche aus Google Sheets...", false, true);
                await syncItemToCloud('delete', {id: w.id});
                showToast("Erfolgreich gelöscht.");
            }
        }

        function openDetailModal(id) {
            const w = whiskeys.find(item => String(item.id) === String(id));
            if (!w) return;
            const rank = [...whiskeys].sort((a, b) => b.score - a.score).findIndex(item => String(item.id) === String(w.id)) + 1;
            const fallbackImg = 'https://images.unsplash.com/photo-1527281400683-1aae777175f8?auto=format&fit=crop&w=600&q=80';
            const formattedDate = new Date(w.date).toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });

            document.getElementById('detailContent').innerHTML = `
                <div class="relative h-72 w-full bg-slate-950 overflow-hidden p-4">
                    <img src="${w.image || fallbackImg}" onerror="this.src='${fallbackImg}'" class="w-full h-full object-contain cursor-zoom-in hover:scale-105 transition duration-300" onclick="openLightbox(this.src)" title="Bild vergrößern">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent pointer-events-none"></div>
                    <div class="absolute bottom-4 left-6 right-6 flex justify-between items-end">
                        <div>
                            <span class="text-xs text-amber-400 font-bold tracking-widest uppercase bg-slate-950/50 px-2 py-1 rounded">Rang #${rank} in deiner Sammlung</span>
                            <h2 class="font-cinzel text-2xl sm:text-3xl font-bold text-slate-100 drop-shadow-md mt-1">${escapeHtml(w.name)}</h2>
                        </div>
                        <div class="bg-amber-500 text-slate-950 font-black text-xl px-4 py-2 rounded-xl shadow-lg flex items-center gap-1.5">
                            <i class="fa-solid fa-star text-sm"></i> ${Number(w.score).toFixed(1)}
                        </div>
                    </div>
                </div>
                <div class="p-6 space-y-6">
                    <div>
                        <h4 class="text-xs font-semibold text-amber-200/80 uppercase tracking-wider mb-2">Tasting Notes & Eindruck</h4>
                        <p class="text-sm text-slate-300 leading-relaxed bg-slate-950/60 border border-slate-800 rounded-xl p-4 italic">${w.notes ? escapeHtml(w.notes) : 'Keine Notizen hinterlegt.'}</p>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-800">
                        <span>Hinzugefügt am: ${formattedDate}</span>
                        <div class="flex gap-3">
                            <button onclick="closeDetailModal(); editWhiskey('${w.id}');" class="text-amber-400 hover:underline">Bearbeiten</button>
                            <button onclick="closeDetailModal(); deleteWhiskey('${w.id}');" class="text-rose-400 hover:underline">Löschen</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        function openLightbox(src) {
            document.getElementById('lightboxImage').src = src;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
            setTimeout(() => { document.getElementById('lightboxImage').src = ''; }, 300);
        }

        let toastTimeout;
        function showToast(msg, isError = false, persistent = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            clearTimeout(toastTimeout);
            toastMessage.textContent = msg;
            if (isError) {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-rose-400 text-lg";
                toast.classList.add('border-rose-500/50'); toast.classList.remove('border-amber-500/50');
            } else {
                toastIcon.className = persistent ? "fa-solid fa-spinner fa-spin text-amber-400 text-lg" : "fa-solid fa-check-circle text-amber-400 text-lg";
                toast.classList.add('border-amber-500/50'); toast.classList.remove('border-rose-500/50');
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (!persistent) {
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }
        }

        function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : ''; }
    </script>
</body>
</html>
